# Nginx: onthewater.ru — публичный сайт (Vite SPA + пререндер)
#
# Сборка: cd /opt/onthewater-app/site && npm install && npm run build
# Корень: /opt/onthewater-app/site/dist
#
# Важно: НЕ проксировать /boats на API — это страницы сайта, не бэкенд.
#
# sudo cp site/nginx-onthewater.ru.conf /etc/nginx/sites-available/onthewater.ru
# (или вставьте те же location в server { listen 443 ssl; ... })
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name onthewater.ru www.onthewater.ru;

    root /opt/onthewater-app/site/dist;
    index index.html;

    # Vite hashed assets — долгий кеш (имена меняются при сборке)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Прочая статика из dist (favicon, og, app-hero.webp и т.п.)
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|xml|txt)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML / SPA — без долгого кеша
    location = /boats {
        try_files /boats/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /boats/ {
        try_files /boats/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

# После certbot: те же location /assets/, статика и / в server { listen 443 ssl; ... }.
