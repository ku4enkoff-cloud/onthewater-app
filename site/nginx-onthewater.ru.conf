# Nginx: onthewater.ru — публичный сайт (Vite SPA + пререндер)
#
# Сборка: cd /opt/onthewater-app/site && npm install && npm run build
# Корень: /opt/onthewater-app/site/dist
#
# Важно: НЕ проксировать /boats на API — это страницы сайта, не бэкенд.
#
# sudo cp site/nginx-onthewater.ru.conf /etc/nginx/sites-available/onthewater.ru
# sudo ln -sf /etc/nginx/sites-available/onthewater.ru /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name onthewater.ru www.onthewater.ru;

    root /opt/onthewater-app/site/dist;
    index index.html;

    # Статика: robots.txt, sitemap.xml, og-default.webp, пререндер /boats/:slug/index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|webp|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|xml|txt)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# После certbot добавьте server { listen 443 ssl; ... } с тем же root и location.
